spring.application.name=qrfusion-backend
server.port=8080

# Servlet Multipart Upload Limits (10MB Cap)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# H2 Database Persistence Configuration (Dev Profile)
spring.datasource.url=jdbc:h2:mem:qrfusiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# JWT Security Secrets (Configurable via JWT_SECRET env var)
qrfusion.jwt.secret=${JWT_SECRET:qrfusion_super_secret_jwt_key_2026_vector_studio_engine_key_must_be_32_bytes_long}
qrfusion.jwt.expiration-ms=86400000

# Google OAuth Client ID & Security Gating
qrfusion.google.client-id=${GOOGLE_CLIENT_ID:1234567890-example.apps.googleusercontent.com}
qrfusion.auth.allow-mock-google-tokens=${ALLOW_MOCK_GOOGLE_TOKENS:false}

# Base URL for Short Redirects
qrfusion.app.base-url=${APP_BASE_URL:http://localhost:8080}

# CORS Allowed Origins
qrfusion.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:4173}